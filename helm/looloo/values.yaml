api:
  enabled: true
  replicaCount: 1
  containerPort: 3000
  nodeEnv: production
  enableTestToken: false
  image:
    repository: rajasekar9698/looloo-api
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  secretName: looloo-api-env

chatbotApi:
  enabled: true
  replicaCount: 1
  containerPort: 3001
  image:
    repository: chatbot-api
    tag: latest
    pullPolicy: IfNotPresent
  secretName: chatbot-api-env
  jwtSecretName: looloo-api-env
  ollamaBaseUrl: http://ollama:11434

web:
  replicaCount: 1
  image:
    repository: rajasekar9698/one-pay-admin
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kong:
  replicaCount: 1
  apiUrl: ""
  chatbotApiUrl: ""
  image:
    repository: kong
    tag: "3.9"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
